<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safer settings</title><style>body{max-width:620px;margin:48px auto;padding:0 20px;color:#172028;font:15px system-ui,sans-serif}h1{letter-spacing:-.04em}label{display:block;margin:20px 0 6px;font-weight:700}input,select{width:100%;padding:10px;border:1px solid #b8c0c3;border-radius:4px;font:inherit}button{margin-top:24px;padding:10px 14px;border:0;background:#172028;color:white;font-weight:700}p{color:#5c6870;line-height:1.5}#status{margin-left:12px;color:#197047}</style></head><body><h1>Safer</h1><p>This extension sends prompts only to your loopback Laya service. The service token is stored in extension-local storage.</p><label for="endpoint">Local service endpoint</label><input id="endpoint" type="url" value="http://127.0.0.1:8787"><label for="token">Local service token</label><input id="token" type="password" autocomplete="off"><label for="failMode">If local service is unavailable</label><select id="failMode"><option value="warn">Warn and allow</option><option value="block">Block submission</option></select><button id="save" type="button">Save settings</button><span id="status" role="status"></span><script src="options.js"></script></body></html>
